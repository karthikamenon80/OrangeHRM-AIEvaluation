name: AI Spec Reviewer

# Manual only: start it from Actions -> AI Spec Reviewer -> Run workflow.
# Each run calls Claude Sonnet once per reviewed feature (~$0.03 each).
on:
  workflow_dispatch:
    inputs:
      review_all:
        description: 'Review all features (3 Claude calls, ~$0.10). Unticked = only the features changed in the latest commit, or all if it changed none.'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/spec-reviewer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/spec-reviewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run AI spec review
        run: |
          if [ "$REVIEW_ALL" = "true" ]; then npm run review -- --all; else npm run review; fi
        env:
          REVIEW_ALL: ${{ inputs.review_all }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-review-reports
          path: tools/spec-reviewer/reports/
          retention-days: 90
