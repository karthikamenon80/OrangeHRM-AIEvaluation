name: AI Spec Reviewer

on:
  pull_request:
    paths:
      - 'openspec/changes/**'
      - 'tests/playwright/**'
  push:
    branches: [master, main]
    paths:
      - 'openspec/changes/**'
      - 'tests/playwright/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/spec-reviewer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/spec-reviewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run AI spec review
        run: npm run review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-review-reports
          path: tools/spec-reviewer/reports/
          retention-days: 30
