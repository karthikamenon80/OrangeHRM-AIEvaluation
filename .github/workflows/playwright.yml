name: Playwright Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Points at OrangeHRM's official public demo (same instance the
          # Day 1 specs were written against) until a local Docker instance
          # (see /docker) is wired into CI. Override BASE_URL/creds via repo
          # secrets to switch targets without touching test code.
          BASE_URL: ${{ secrets.OHRM_BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          OHRM_ADMIN_USERNAME: ${{ secrets.OHRM_ADMIN_USERNAME || 'Admin' }}
          OHRM_ADMIN_PASSWORD: ${{ secrets.OHRM_ADMIN_PASSWORD || 'admin123' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          retention-days: 14
